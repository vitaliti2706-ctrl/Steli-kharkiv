<title>Стелі Харків — натяжні стелі у Харкові</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Arial,sans-serif;background:#f4f6f8;color:#111827}
a{text-decoration:none;color:inherit}
.wrap{max-width:1180px;margin:auto;padding:0 18px}

.phone{font-weight:900}

.badge{color:#60a5fa;font-weight:900;margin-bottom:15px}
h1{font-size:58px;line-height:.95;margin-bottom:20px}
.hero p{font-size:20px;color:#cbd5e1;margin-bottom:24px}
.price{font-size:38px;font-weight:900;margin-bottom:22px}
.btns{display:flex;gap:12px;flex-wrap:wrap}
.btn{display:inline-block;padding:16px 24px;border-radius:10px;font-weight:900}
.blue{background:#0057ff;color:#fff}
.green{background:#16a34a;color:#fff}
.hero-img img{width:100%;height:420px;object-fit:cover;border-radius:18px;box-shadow:0 25px 70px rgba(0,0,0,.4)}

.stats{background:#07101f;color:#fff}
.stats-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:1px}
.stat{padding:22px;text-align:center;border-left:1px solid #1e293b}
.stat b{font-size:24px;display:block}
.stat span{color:#94a3b8}

.section-title{font-size:36px;margin-bottom:24px}
.gallery{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
.card{background:#fff;border-radius:16px;overflow:hidden;box-shadow:0 12px 35px rgba(0,0,0,.09)}
.card img{width:100%;height:240px;object-fit:cover;display:block}
.card-body{padding:18px}
.card-body h3{font-size:22px;margin-bottom:6px}
.card-body p{color:#667085;font-size:16px}

.why{background:#fff}
.why-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
.why-card{background:#f8fafc;border:1px solid #e5e7eb;border-radius:14px;padding:22px}
.why-card h3{margin-bottom:8px}
.why-card p{color:#667085}

.contact{background:#0b1220;color:#fff;border-radius:22px;padding:35px;display:grid;grid-template-columns:1.2fr 1fr;gap:25px;align-items:center}
.contact h2{font-size:34px;margin-bottom:10px}
.contact p{color:#cbd5e1;font-size:18px}
.contact .big-phone{font-size:40px;font-weight:900;margin:18px 0}

footer{text-align:center;padding:25px;color:#667085}
