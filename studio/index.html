<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Potolok Studio — тест потолка</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Arial,Helvetica,sans-serif;background:#eef3f9;color:#0f172a;padding:14px}
.wrap{max-width:1100px;margin:0 auto}
.header{background:#fff;border:1px solid #dbe5f2;border-radius:20px;padding:16px;margin-bottom:14px;display:flex;justify-content:space-between;align-items:center}
.logo{font-size:26px;font-weight:950}.logo span{color:#075BFF}
.home{background:#075BFF;color:#fff;padding:10px 14px;border-radius:12px;text-decoration:none;font-weight:900;font-size:13px}
.card{background:#fff;border:1px solid #dbe5f2;border-radius:22px;overflow:hidden;box-shadow:0 18px 45px rgba(15,23,42,.12)}
.scene{position:relative;height:520px;background:#ddd;overflow:hidden}
.ceiling{position:absolute;left:0;right:0;top:0;height:38%;background:#fff;clip-path:polygon(0 0,100% 0,100% 72%,72% 100%,28% 100%,0 72%);transition:.25s}
.shadow{position:absolute;left:0;right:0;top:0;height:38%;pointer-events:none;clip-path:polygon(0 0,100% 0,100% 72%,72% 100%,28% 100%,0 72%);background:radial-gradient(circle at 50% 20%,rgba(255,255,255,.7),transparent 34%),linear-gradient(180deg,rgba(255,255,255,.35),rgba(0,0,0,.08));mix-blend-mode:soft-light}
.wall{position:absolute;left:0;right:0;top:34%;bottom:28%;background:linear-gradient(90deg,#d8d0c5,#efe7dc 45%,#d8d0c5)}
.floor{position:absolute;left:0;right:0;bottom:0;height:30%;background:linear-gradient(180deg,#b69468,#8f6b45)}
.back-line{position:absolute;left:28%;right:28%;top:38%;height:3px;background:rgba(15,23,42,.26)}
.lamp{position:absolute;left:50%;top:23%;width:120px;height:70px;transform:translate(-50%,-50%);border:10px solid #151923;border-radius:50%;box-shadow:0 0 35px rgba(255,255,255,.9);background:rgba(255,255,255,.35)}
.panel{padding:16px}
h1{font-size:22px;margin-bottom:8px}
p{color:#64748b;font-size:14px;margin-bottom:14px}
.colors{display:flex;gap:10px;flex-wrap:wrap}
.btn{min-width:110px;height:44px;border:2px solid #dbe5f2;border-radius:14px;background:#fff;font-weight:900;cursor:pointer}
.btn.active{border-color:#075BFF;color:#075BFF;background:#eef5ff}
@media(max-width:600px){.scene{height:430px}.lamp{transform:translate(-50%,-50%) scale(.78)}.logo{font-size:22px}}
</style>
</head>
<body>

<div class="wrap">
  <div class="header">
    <div class="logo">Potolok<span>.in.ua</span></div>
    <a class="home" href="../index.html">← Головна</a>
  </div>

  <div class="card">
    <div class="scene">
      <div id="ceiling" class="ceiling"></div>
      <div class="shadow"></div>
      <div class="wall"></div>
      <div class="floor"></div>
      <div class="back-line"></div>
      <div class="lamp"></div>
    </div>

    <div class="panel">
      <h1>Тест зміни кольору стелі</h1>
      <p>Поки тільки потолок і 3 кольори. Далі будемо додавати меню.</p>

      <div class="colors">
        <button class="btn active" onclick="setCeiling('#ffffff', this)">Білий</button>
        <button class="btn" onclick="setCeiling('#111827', this)">Чорний</button>
        <button class="btn" onclick="setCeiling('#d7c0a1', this)">Бежевий</button>
      </div>
    </div>
  </div>
</div>

<script>
function setCeiling(color, btn){
  document.getElementById('ceiling').style.background = color;
  document.querySelectorAll('.btn').forEach(function(b){
    b.classList.remove('active');
  });
  btn.classList.add('active');
}
</script>

</body>
</html>
