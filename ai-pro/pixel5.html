<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Potolok AI PRO — Pixel 5.4</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#f4f7fb}
#appFrame{border:0;width:100%;height:100%;display:block}
</style>
</head>
<body>
<iframe id="appFrame" src="./pixel5.html?v=54"></iframe>

<script>
/*
  Pixel 5.4 — единый файл для проверки.
  Загружает текущий pixel5.html и добавляет доработанную разметку на фото:
  — линии рисуются одним движением;
  — выбор, перемещение, поворот и растягивание;
  — повторное нажатие кнопки выключает инструмент;
  — масштабирование 100–300%;
  — номера отметок остаются;
  — данные сохраняются в комнату и передаются AI.
*/
const frame=document.getElementById('appFrame');

frame.addEventListener('load',()=>{
  const w=frame.contentWindow;
  const d=frame.contentDocument;
  if(!w||!d)return;

  d.title='Potolok AI PRO — Pixel 5.4';
  const badge=d.querySelector('.hero-badge');
  if(badge)badge.textContent='✨ POTOLOK AI PRO — PIXEL 5.4';

  const style=d.createElement('style');
  style.textContent=`
    .markup-stage-wrap{position:relative;overflow:hidden!important;touch-action:none}
    #markupCanvas{transform-origin:0 0;max-height:none!important}
    .markup-zoom{display:flex;gap:7px;justify-content:flex-end;margin-top:9px}
    .markup-zoom button{min-width:44px;height:38px;border:1px solid #dbe3ef;background:#fff;border-radius:9px;font-weight:950;color:#075bff}
    .markup-help{font-size:9px;color:#64748b;line-height:1.4;margin-top:7px}
    .markup-tools .tool-btn.active{background:#075bff;color:#fff;border-color:#075bff}
  `;
  d.head.appendChild(style);

  const stage=d.querySelector('.markup-stage-wrap');
  const canvas=d.getElementById('markupCanvas');
  const status=d.getElementById('markupStatus');
  if(!stage||!canvas||!status)return;

  const zoomBar=d.createElement('div');
  zoomBar.className='markup-zoom';
  zoomBar.innerHTML=`
    <button type="button" id="markupZoomOut">−</button>
    <button type="button" id="markupZoomLabel">100%</button>
    <button type="button" id="markupZoomIn">＋</button>
  `;
  stage.insertAdjacentElement('beforebegin',zoomBar);

  const help=d.createElement('div');
  help.className='markup-help';
  help.textContent='Лінії: затисніть палець і протягніть. Вибір: торкніться елемента; синя ручка — поворот, зелена — довжина.';
  stage.insertAdjacentElement('afterend',help);

  let items=Array.isArray(w.markupItems)?w.markupItems:[];
  let tool='select';
  let selected=-1;
  let dragMode='';
  let dragStart=null;
  let draft=null;
  let zoom=1;
  let panX=0,panY=0;
  let history=[];
  let pointerId=null;

  const linearTypes=['track','surfaceTrack','lightline','cornice','floating','shadow'];
  const pointTypes=['spot','chandelier'];
  const colors={
    spot:'#f59e0b',chandelier:'#7c3aed',track:'#111827',surfaceTrack:'#475569',
    lightline:'#facc15',cornice:'#0ea5e9',floating:'#22c55e',shadow:'#111827'
  };

  function syncGlobal(){
    w.markupItems=items;
    if(typeof w.saveMarkupToRoom==='function')w.saveMarkupToRoom();
  }

  function pushHistory(){
    history.push(JSON.stringify(items));
    if(history.length>50)history.shift();
  }

  function pointFromEvent(e){
    const r=canvas.getBoundingClientRect();
    return {
      x:(e.clientX-r.left)*canvas.width/r.width,
      y:(e.clientY-r.top)*canvas.height/r.height
    };
  }

  function distanceToSegment(px,py,x1,y1,x2,y2){
    const dx=x2-x1,dy=y2-y1;
    const l2=dx*dx+dy*dy;
    if(!l2)return Math.hypot(px-x1,py-y1);
    let t=((px-x1)*dx+(py-y1)*dy)/l2;
    t=Math.max(0,Math.min(1,t));
    return Math.hypot(px-(x1+t*dx),py-(y1+t*dy));
  }

  function hitTest(p){
    for(let i=items.length-1;i>=0;i--){
      const it=items[i];
      if(it.x2!=null){
        if(distanceToSegment(p.x,p.y,it.x,it.y,it.x2,it.y2)<24)return i;
      }else if(Math.hypot(p.x-it.x,p.y-it.y)<28)return i;
    }
    return -1;
  }

  function itemCenter(it){
    return it.x2==null?{x:it.x,y:it.y}:{x:(it.x+it.x2)/2,y:(it.y+it.y2)/2};
  }

  function handles(it){
    if(it.x2==null)return null;
    const c=itemCenter(it);
    const dx=it.x2-it.x,dy=it.y2-it.y;
    const len=Math.hypot(dx,dy)||1;
    const nx=-dy/len,ny=dx/len;
    return {
      resize:{x:it.x2,y:it.y2},
      rotate:{x:c.x+nx*48,y:c.y+ny*48},
      center:c
    };
  }

  function drawAll(ctx){
    const all=draft?[...items,draft]:items;
    all.forEach((it,idx)=>{
      const isDraft=idx>=items.length;
      const c=colors[it.type]||'#075bff';
      ctx.save();
      ctx.strokeStyle=c;
      ctx.fillStyle=c;
      ctx.lineWidth=isDraft?7:8;
      ctx.lineCap='round';

      if(it.x2!=null){
        ctx.beginPath();ctx.moveTo(it.x,it.y);ctx.lineTo(it.x2,it.y2);ctx.stroke();
        ctx.fillStyle='#fff';ctx.font='bold 18px Arial';ctx.textAlign='center';
        ctx.fillText(String(idx+1),(it.x+it.x2)/2,(it.y+it.y2)/2-11);
      }else{
        ctx.beginPath();ctx.arc(it.x,it.y,it.type==='chandelier'?18:11,0,Math.PI*2);ctx.fill();
        ctx.strokeStyle='#fff';ctx.lineWidth=3;ctx.stroke();
        ctx.fillStyle='#fff';ctx.font='bold 16px Arial';ctx.textAlign='left';
        ctx.fillText(String(idx+1),it.x+16,it.y-12);
      }

      if(idx===selected&&!isDraft){
        ctx.strokeStyle='#075bff';ctx.lineWidth=3;ctx.setLineDash([8,6]);
        if(it.x2!=null){
          const h=handles(it);
          ctx.beginPath();ctx.moveTo(it.x,it.y);ctx.lineTo(it.x2,it.y2);ctx.stroke();
          ctx.setLineDash([]);
          ctx.strokeStyle='#22c55e';ctx.fillStyle='#fff';ctx.lineWidth=4;
          ctx.beginPath();ctx.arc(h.resize.x,h.resize.y,14,0,Math.PI*2);ctx.fill();ctx.stroke();
          ctx.strokeStyle='#075bff';
          ctx.beginPath();ctx.moveTo(h.center.x,h.center.y);ctx.lineTo(h.rotate.x,h.rotate.y);ctx.stroke();
          ctx.beginPath();ctx.arc(h.rotate.x,h.rotate.y,14,0,Math.PI*2);ctx.fill();ctx.stroke();
        }else{
          ctx.beginPath();ctx.arc(it.x,it.y,24,0,Math.PI*2);ctx.stroke();
        }
      }
      ctx.restore();
    });
    status.textContent=items.length
      ?`Позначок: ${items.length}. Вони будуть передані AI.`
      :'Розмітки поки немає.';
  }

  function redraw(){
    const ctx=canvas.getContext('2d');
    ctx.clearRect(0,0,canvas.width,canvas.height);
    const src=w.uploadedImageBase64||'';
    if(src){
      const im=new Image();
      im.onload=()=>{ctx.drawImage(im,0,0,canvas.width,canvas.height);drawAll(ctx)};
      im.src=src;
    }else{
      ctx.fillStyle='#eef5ff';ctx.fillRect(0,0,canvas.width,canvas.height);
      ctx.fillStyle='#64748b';ctx.font='bold 24px Arial';ctx.textAlign='center';
      ctx.fillText('Завантажте фото кімнати',canvas.width/2,canvas.height/2);
    }
  }

  function applyZoom(){
    canvas.style.transform=`translate(${panX}px,${panY}px) scale(${zoom})`;
    stage.style.minHeight=Math.round(canvas.clientHeight*zoom)+'px';
    d.getElementById('markupZoomLabel').textContent=Math.round(zoom*100)+'%';
  }

  function setTool(next,btn){
    const same=tool===next&&btn?.classList.contains('active');
    d.querySelectorAll('.markup-tools .tool-btn').forEach(b=>b.classList.remove('active'));
    if(same){
      tool='select';
      const selectBtn=[...d.querySelectorAll('.markup-tools .tool-btn')].find(b=>b.textContent.includes('Вибір'));
      selectBtn?.classList.add('active');
    }else{
      tool=next;
      btn?.classList.add('active');
    }
    selected=-1;draft=null;dragMode='';redraw();
  }

  w.setMarkupTool=setTool;

  d.querySelectorAll('.markup-tools .tool-btn').forEach(btn=>{
    const old=btn.getAttribute('onclick')||'';
    const m=old.match(/setMarkupTool\('([^']+)'/);
    if(!m)return;
    const t=m[1];
    btn.removeAttribute('onclick');
    btn.addEventListener('click',()=>setTool(t,btn));
  });

  function pointerDown(e){
    if(!w.uploadedImageBase64)return;
    e.preventDefault();
    pointerId=e.pointerId;
    canvas.setPointerCapture(pointerId);
    const p=pointFromEvent(e);

    if(tool==='select'){
      selected=hitTest(p);
      if(selected<0){redraw();return}
      pushHistory();
      const it=items[selected];
      if(it.x2!=null){
        const h=handles(it);
        if(Math.hypot(p.x-h.resize.x,p.y-h.resize.y)<28)dragMode='resize';
        else if(Math.hypot(p.x-h.rotate.x,p.y-h.rotate.y)<28)dragMode='rotate';
        else dragMode='move';
      }else dragMode='move';
      dragStart={p,item:JSON.parse(JSON.stringify(it))};
      redraw();
      return;
    }

    if(pointTypes.includes(tool)){
      pushHistory();
      items.push({type:tool,x:p.x,y:p.y});
      selected=items.length-1;
      syncGlobal();redraw();
      if(typeof w.autosave==='function')w.autosave();
      return;
    }

    if(linearTypes.includes(tool)){
      pushHistory();
      draft={type:tool,x:p.x,y:p.y,x2:p.x,y2:p.y};
      dragMode='draw';
      dragStart={p};
      redraw();
    }
  }

  function pointerMove(e){
    if(e.pointerId!==pointerId)return;
    const p=pointFromEvent(e);

    if(dragMode==='draw'&&draft){
      draft.x2=p.x;draft.y2=p.y;redraw();return;
    }
    if(selected<0||!dragStart)return;
    const it=items[selected],base=dragStart.item;

    if(dragMode==='move'){
      const dx=p.x-dragStart.p.x,dy=p.y-dragStart.p.y;
      it.x=base.x+dx;it.y=base.y+dy;
      if(base.x2!=null){it.x2=base.x2+dx;it.y2=base.y2+dy}
    }else if(dragMode==='resize'&&it.x2!=null){
      it.x2=p.x;it.y2=p.y;
    }else if(dragMode==='rotate'&&it.x2!=null){
      const c=itemCenter(base);
      const len=Math.hypot(base.x2-base.x,base.y2-base.y)/2;
      let a=Math.atan2(p.y-c.y,p.x-c.x)-Math.PI/2;
      const snap=Math.PI/4;
      const snapped=Math.round(a/snap)*snap;
      if(Math.abs(a-snapped)<0.08)a=snapped;
      const dx=Math.cos(a)*len,dy=Math.sin(a)*len;
      it.x=c.x-dx;it.y=c.y-dy;it.x2=c.x+dx;it.y2=c.y+dy;
    }
    redraw();
  }

  function pointerUp(e){
    if(e.pointerId!==pointerId)return;
    if(dragMode==='draw'&&draft){
      if(Math.hypot(draft.x2-draft.x,draft.y2-draft.y)>12){
        items.push(draft);selected=items.length-1;
      }
      draft=null;syncGlobal();
      if(typeof w.autosave==='function')w.autosave();
    }else if(['move','resize','rotate'].includes(dragMode)){
      syncGlobal();
      if(typeof w.autosave==='function')w.autosave();
    }
    dragMode='';dragStart=null;pointerId=null;redraw();
  }

  canvas.replaceWith(canvas.cloneNode(true));
  const newCanvas=d.getElementById('markupCanvas');
  newCanvas.addEventListener('pointerdown',pointerDown);
  newCanvas.addEventListener('pointermove',pointerMove);
  newCanvas.addEventListener('pointerup',pointerUp);
  newCanvas.addEventListener('pointercancel',pointerUp);

  // Переназначаем ссылку на canvas после clone.
  Object.defineProperty(w,'markupCanvas',{value:newCanvas,writable:true,configurable:true});
  const liveCanvas=newCanvas;

  // Локальные функции должны работать с новым canvas.
  const oldCanvas=canvas;
  canvas=liveCanvas;

  const oldUndo=w.undoMarkup;
  w.undoMarkup=function(){
    const s=history.pop();
    if(s!=null){items=JSON.parse(s);selected=-1;syncGlobal();redraw();if(typeof w.autosave==='function')w.autosave()}
    else if(typeof oldUndo==='function')oldUndo();
  };

  w.clearMarkup=function(){
    if(!items.length)return;
    pushHistory();items=[];selected=-1;draft=null;syncGlobal();redraw();
    if(typeof w.autosave==='function')w.autosave();
  };

  d.getElementById('markupZoomIn').onclick=()=>{zoom=Math.min(3,+(zoom+.25).toFixed(2));applyZoom()};
  d.getElementById('markupZoomOut').onclick=()=>{zoom=Math.max(1,+(zoom-.25).toFixed(2));if(zoom===1){panX=0;panY=0}applyZoom()};
  d.getElementById('markupZoomLabel').onclick=()=>{zoom=1;panX=0;panY=0;applyZoom()};

  // Улучшенная передача в AI.
  const oldGenerate=w.generateAI;
  w.generateAI=async function(){
    w.markupItems=items;
    syncGlobal();
    return oldGenerate.call(w);
  };

  // Синхронизация при смене комнаты/фото.
  const oldRestore=w.restoreRoom;
  w.restoreRoom=function(room){
    oldRestore.call(w,room);
    items=Array.isArray(w.markupItems)?w.markupItems:[];
    selected=-1;zoom=1;panX=0;panY=0;applyZoom();redraw();
  };

  // Первичная отрисовка.
  items=Array.isArray(w.markupItems)?w.markupItems:[];
  applyZoom();redraw();
});
</script>
</body>
</html>
